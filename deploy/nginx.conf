# MegavirTrace behind nginx: one origin, /api -> FastAPI, everything else -> Next.js.
# Replace example.org; TLS via certbot or your provider.
server {
    listen 443 ssl http2;
    server_name example.org;
    # ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    client_max_body_size 64k;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;          # strips the /api prefix
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;       # the API's strict Origin check needs it
        proxy_set_header X-Real-IP $remote_addr;    # per-visitor limits (MEGAVIR_TRUST_PROXY=1)
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name example.org;
    return 301 https://$host$request_uri;
}
