services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: megavir
      POSTGRES_PASSWORD: megavir
      POSTGRES_DB: megavir
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - megavir-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megavir"]
      interval: 5s
      retries: 20

volumes:
  megavir-pg:
